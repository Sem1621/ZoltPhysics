name: Doxygen Action

# Zolt: runs only when an input of the Doxyfile changes (the C++ code and the upstream docs), not on a change to the Zig
# port. Keep this filter when syncing with upstream.
on:
  push:
    branches: [ master ]
    paths:
      - 'Jolt/**'
      - 'Docs/*'
      - 'Docs/Images/**'
      - 'Build/README.md'
      - 'Doxyfile'
      - 'doxygen-awesome.css'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

# Builds and deploys doxygen documentation
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Doxygen Action
      uses: mattnotmitt/doxygen-action@v1.12.0
      with:
        doxyfile-path: "./Doxyfile"
        working-directory: "."

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Build/Doxygen
        force_orphan: true
