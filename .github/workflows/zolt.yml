name: Zolt (Zig port)

on:
  push:
    branches: [ master ]
    paths:
      - 'Zolt/**'
      - 'ZoltTests/**'
      - 'ZoltParity/**'
      - 'ZoltPerformanceTest/**'
      - 'ZoltHelloWorld/**'
      - 'HelloWorld/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'Docs/Zolt/**'
      - '.github/workflows/zolt.yml'
  pull_request:
    paths:
      - 'Zolt/**'
      - 'ZoltTests/**'
      - 'ZoltParity/**'
      - 'ZoltPerformanceTest/**'
      - 'ZoltHelloWorld/**'
      - 'HelloWorld/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'tools/**'
      - 'Docs/Zolt/**'
      - '.github/workflows/zolt.yml'
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Format and port status
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Check formatting
      run: zig fmt --check Zolt ZoltTests ZoltParity ZoltPerformanceTest ZoltHelloWorld build.zig build.zig.zon
    - name: Check that Docs/Zolt/Progress.md is up to date and the port headers are valid
      run: python3 tools/port_status.py --check

  test:
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }} ${{ matrix.optimize }} double_precision=${{ matrix.double_precision }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        optimize: [ Debug ]
        double_precision: [ false, true ]
        include:
          - os: ubuntu-latest
            optimize: ReleaseFast
            double_precision: false
          - os: ubuntu-latest
            optimize: ReleaseFast
            double_precision: true
          - os: ubuntu-latest
            optimize: ReleaseSafe
            double_precision: false
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Test
      run: zig build test --summary all -Doptimize=${{ matrix.optimize }} -Ddouble_precision=${{ matrix.double_precision }}

  parity:
    runs-on: ubuntu-latest
    name: Parity with C++ Jolt ${{ matrix.optimize }} double_precision=${{ matrix.double_precision }}
    strategy:
      fail-fast: false
      matrix:
        # ReleaseSafe checks Zolt's asserts. ReleaseFast has no asserts, so it also compares the inputs for which
        # Jolt's own asserts would fire (failing / degenerate decompositions, non-finite inertia, ...), which the
        # parity tests skip in builds with asserts.
        optimize: [ ReleaseSafe, ReleaseFast ]
        double_precision: [ false, true ]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Compare with the C++ library (includes hello-world-check, milestone M5)
      run: zig build parity --summary all -Doptimize=${{ matrix.optimize }} -Ddouble_precision=${{ matrix.double_precision }}

  determinism:
    # Milestones M6 and M8: ZoltPerformanceTest reproduces the hashes that Jolt publishes in determinism_check.yml (same
    # arguments), and the hash does not depend on the thread count
    runs-on: ubuntu-latest
    name: Determinism check double_precision=${{ matrix.double_precision }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - double_precision: false
            pyramid_hash: '0x74d0118836ac0892'
            convex_vs_mesh_hash: '0x918f27cacae9752b'
            high_speed_hash: '0x58d8d892536f4021'
            character_virtual_hash: '0xc1d4e05b164b1221'
            ragdoll_hash: '0x3be6ea76c07a2ac8'
          - double_precision: true
            pyramid_hash: '0xf07f04597a102a82'
            convex_vs_mesh_hash: '0x3729e7890b93a289'
            high_speed_hash: '0x183f48cb94739ce'
            character_virtual_hash: '0xa0b16727aa16fdb0'
            ragdoll_hash: '0x8dd6bc501859a228'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Build
      run: zig build -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }}
    # Milestone M9: the oracle. The C++ PerformanceTest, built like the parity reference (with JPH_OBJECT_STREAM), must
    # give Jolt's published Ragdoll hash. Then the toolchain of the parity reference is exact for the Ragdoll scene.
    - name: Jolt oracle Ragdoll (C++ PerformanceTest)
      run: zig build jolt-performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=max -s=Ragdoll -validate_hash=${{ matrix.ragdoll_hash }}
    - name: Test ConvexVsMesh
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=max -s=ConvexVsMesh -validate_hash=${{ matrix.convex_vs_mesh_hash }}
    - name: Test HighSpeed
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=max -s=HighSpeed -validate_hash=${{ matrix.high_speed_hash }}
    - name: Test Pyramid
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=max -s=Pyramid -validate_hash=${{ matrix.pyramid_hash }}
    - name: Test Pyramid with 1 thread
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=1 -s=Pyramid -validate_hash=${{ matrix.pyramid_hash }}
    - name: Test Pyramid with 2 threads
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=LinearCast -t=2 -s=Pyramid -validate_hash=${{ matrix.pyramid_hash }}
    - name: Test CharacterVirtual
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=Discrete -t=max -s=CharacterVirtual -validate_hash=${{ matrix.character_virtual_hash }}
    - name: Test CharacterVirtual with 1 thread
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=Discrete -t=1 -s=CharacterVirtual -validate_hash=${{ matrix.character_virtual_hash }}
    - name: Test CharacterVirtual with 2 threads
      run: zig build performance-test -Doptimize=ReleaseFast -Ddouble_precision=${{ matrix.double_precision }} -- -q=Discrete -t=2 -s=CharacterVirtual -validate_hash=${{ matrix.character_virtual_hash }}
