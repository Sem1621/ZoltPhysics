name: Doxygen Action

on:
  push:
    branches: [ master ]

# Builds and deploys doxygen documentation
jobs:
  build:
    # Zolt: only upstream Jolt publishes its C++ API docs to GitHub Pages. In the ZoltPhysics fork the deploy step has
    # no write access (the push of gh-pages failed with a 403 on every push to master), and the port's docs are
    # Docs/Zolt and `zig build docs`.
    if: github.repository == 'jrouwe/JoltPhysics'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Doxygen Action
      uses: mattnotmitt/doxygen-action@v1.12.0
      with:
        doxyfile-path: "./Doxyfile"
        working-directory: "."

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Build/Doxygen
        force_orphan: true
